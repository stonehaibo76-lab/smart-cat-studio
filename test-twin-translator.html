<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>孪生译员功能测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }
    
    .header p {
      opacity: 0.9;
      font-size: 1.1em;
    }
    
    .controls {
      padding: 30px;
      background: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: #667eea;
      color: white;
    }
    
    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #e9ecef;
      color: #495057;
    }
    
    .btn-secondary:hover {
      background: #dee2e6;
    }
    
    .btn-success {
      background: #28a745;
      color: white;
    }
    
    .btn-success:hover {
      background: #218838;
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }
    
    .content {
      padding: 30px;
      max-height: 70vh;
      overflow-y: auto;
    }
    
    .phase-section {
      margin-bottom: 40px;
      animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .phase-title {
      font-size: 1.5em;
      color: #495057;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 3px solid #667eea;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .phase-number {
      background: #667eea;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    
    .test-case {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      border-left: 4px solid #667eea;
    }
    
    .test-case-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    
    .test-case-title {
      font-weight: 600;
      color: #495057;
    }
    
    .test-case-status {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .status-pending {
      background: #ffc107;
      color: #856404;
    }
    
    .status-success {
      background: #28a745;
      color: white;
    }
    
    .status-error {
      background: #dc3545;
      color: white;
    }
    
    .test-case-content {
      display: grid;
      gap: 10px;
    }
    
    .field {
      display: flex;
      gap: 10px;
    }
    
    .field-label {
      font-weight: 500;
      color: #6c757d;
      min-width: 80px;
    }
    
    .field-value {
      color: #495057;
      flex: 1;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 2em;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .stat-label {
      opacity: 0.9;
      font-size: 0.9em;
    }
    
    .console-output {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 14px;
      line-height: 1.6;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 20px;
    }
    
    .console-output .log-info {
      color: #4ec9b0;
    }
    
    .console-output .log-success {
      color: #6a9955;
    }
    
    .console-output .log-error {
      color: #f48771;
    }
    
    .console-output .log-warning {
      color: #dcdcaa;
    }
    
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e9ecef;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 15px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s ease;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }
    
    .empty-state-icon {
      font-size: 4em;
      margin-bottom: 20px;
    }
    
    .feature-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    
    .feature-item {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #28a745;
    }
    
    .feature-title {
      font-weight: 600;
      color: #495057;
      margin-bottom: 5px;
    }
    
    .feature-desc {
      color: #6c757d;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎭 孪生译员功能测试</h1>
      <p>四个阶段完整功能验证</p>
    </div>
    
    <div class="controls">
      <button class="btn btn-primary" id="runFullTest" onclick="runTest('full')">
        🚀 运行完整测试
      </button>
      <button class="btn btn-secondary" id="runQuickTest" onclick="runTest('quick')">
        ⚡ 快速测试
      </button>
      <button class="btn btn-success" id="exportData" onclick="exportTestData()">
        📥 导出测试数据
      </button>
      <button class="btn btn-secondary" id="clearOutput" onclick="clearOutput()">
        🗑️ 清空输出
      </button>
    </div>
    
    <div class="content" id="content">
      <div class="empty-state">
        <div class="empty-state-icon">🎯</div>
        <h2>准备就绪</h2>
        <p>点击"运行完整测试"开始验证孪生译员的所有功能</p>
        
        <div class="feature-list">
          <div class="feature-item">
            <div class="feature-title">第一阶段：基础增强</div>
            <div class="feature-desc">修复空值、扩充术语、增加例句</div>
          </div>
          <div class="feature-item">
            <div class="feature-title">第二阶段：核心特征</div>
            <div class="feature-desc">术语映射、相似检索、语义分析</div>
          </div>
          <div class="feature-item">
            <div class="feature-title">第三阶段：风格增强</div>
            <div class="feature-desc">语序偏好、翻译策略、标点风格</div>
          </div>
          <div class="feature-item">
            <div class="feature-title">第四阶段：架构优化</div>
            <div class="feature-desc">动态衰减、负面反馈、领域自适应</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // 导入测试脚本
    import * as TestModule from '../scripts/test-twin-translator-browser.js';
    
    // 挂载到全局
    window.runTwinTranslatorTest = TestModule.runTwinTranslatorTest;
    window.quickTest = TestModule.quickTest;
    window.showProfileDetails = TestModule.showProfileDetails;
  </script>

  <script>
    let testProfile = null;
    let currentPhase = 0;
    
    const testCases = [
      {
        description: '技术文档 - API使用说明',
        source: 'Click the API button to configure the settings.',
        aiTranslation: '点击API按钮来配置设置。',
        userTranslation: '点击 API 按钮以配置设置。'
      },
      {
        description: 'UI操作 - 菜单导航',
        source: 'Select the item from the dropdown menu and click OK.',
        aiTranslation: '从下拉菜单中选择项目并点击确定。',
        userTranslation: '从下拉菜单中选择项目，然后点击"确定"。'
      },
      {
        description: '状态描述 - 功能启用',
        source: 'The feature is enabled by default in the configuration panel.',
        aiTranslation: '该功能默认在配置面板中启用。',
        userTranslation: '配置面板中，该功能默认已启用。'
      },
      {
        description: '错误信息 - 提示用户',
        source: 'Please ensure that all parameters are valid before submitting.',
        aiTranslation: '请在提交前确保所有参数有效。',
        userTranslation: '提交前请确保所有参数均有效。'
      },
      {
        description: '技术术语 - SDK引用',
        source: 'Import the SDK and initialize the component with the API key.',
        aiTranslation: '导入SDK并使用API密钥初始化组件。',
        userTranslation: '导入 SDK，然后使用 API Key 初始化组件。'
      },
      {
        description: '条件句 - 条件前置',
        source: 'If the connection fails, retry after 5 seconds.',
        aiTranslation: '如果连接失败，5秒后重试。',
        userTranslation: '连接失败时，5秒后重试。'
      },
      {
        description: '被动语态 - 转主动',
        source: 'The data is stored in the database securely.',
        aiTranslation: '数据安全地存储在数据库中。',
        userTranslation: '系统将数据安全地存储在数据库中。'
      },
      {
        description: '复杂结构 - 长句拆分',
        source: 'Navigate to the Settings menu, select Preferences, and enable the option to activate the feature.',
        aiTranslation: '导航到设置菜单，选择首选项，并启用选项以激活功能。',
        userTranslation: '进入"设置"菜单 → 选择"偏好" → 启用该选项，即可激活功能。'
      }
    ];
    
    async function runTest(type) {
      const content = document.getElementById('content');
      const runBtn = document.getElementById('runFullTest');
      const quickBtn = document.getElementById('runQuickTest');
      
      // 禁用按钮
      runBtn.disabled = true;
      quickBtn.disabled = true;
      
      // 清空内容
      content.innerHTML = '<div class="progress-bar"><div class="progress-fill" id="progress" style="width: 0%"></div></div>';
      
      const progress = document.getElementById('progress');
      let progressValue = 0;
      
      // 动态导入模块
      const { createTwinTranslatorProfile, processLearningFeedback, findSimilarExamples } = 
        await import('../services/twinTranslatorService.js');
      
      // 创建阶段标题
      const phases = [
        '第一阶段：基础增强',
        '第二阶段：核心特征',
        '第三阶段：风格增强',
        '第四阶段：架构优化'
      ];
      
      let phaseContent = '';
      
      // 创建译员
      progressValue = 10;
      progress.style.width = progressValue + '%';
      
      const profile = createTwinTranslatorProfile('测试译员', '功能测试', 'en-zh');
      testProfile = profile;
      
      phaseContent += createPhaseSection(0, '创建孪生译员', `
        <div class="test-case">
          <div class="test-case-content">
            <div class="field">
              <span class="field-label">名称:</span>
              <span class="field-value">${profile.name}</span>
            </div>
            <div class="field">
              <span class="field-label">ID:</span>
              <span class="field-value">${profile.id}</span>
            </div>
            <div class="field">
              <span class="field-label">语言对:</span>
              <span class="field-value">${profile.languagePair}</span>
            </div>
            <div class="field">
              <span class="field-label">状态:</span>
              <span class="field-value" style="color: #28a745">✓ 创建成功</span>
            </div>
          </div>
        </div>
      `);
      content.innerHTML = phaseContent + '<div class="progress-bar"><div class="progress-fill" id="progress" style="width: ' + progressValue + '%"></div></div>';
      
      // 运行测试
      const range = type === 'full' ? testCases : testCases.slice(0, 3);
      
      for (let i = 0; i < range.length; i++) {
        const testCase = range[i];
        const phaseIndex = Math.floor(i / 2);
        
        // 添加阶段标题
        if (i === 0 || (i === 2) || (i === 4) || (i === 6)) {
          if (type === 'full') {
            phaseContent += createPhaseSection(phaseIndex, phases[phaseIndex], '');
            content.innerHTML = phaseContent + '<div class="progress-bar"><div class="progress-fill" id="progress" style="width: ' + progressValue + '%"></div></div>';
            document.getElementById('content').scrollIntoView({ behavior: 'smooth', block: 'end' });
          }
        }
        
        // 学习测试用例
        progressValue = 10 + ((i + 1) / range.length) * 80;
        progress.style.width = progressValue + '%';
        
        const updatedProfile = processLearningFeedback(
          profile,
          testCase.source,
          undefined,
          testCase.userTranslation,
          'positive',
          testCase.aiTranslation
        );
        
        // 更新profile
        Object.assign(profile, updatedProfile);
        testProfile = profile;
        
        // 添加测试结果
        const lastExample = profile.trainingExamples[profile.trainingExamples.length - 1];
        const testCaseHTML = createTestCase(testCase, lastExample, profile);
        
        const phaseElements = content.querySelectorAll('.phase-section-content');
        if (phaseElements.length > 0) {
          phaseElements[phaseElements.length - 1].innerHTML += testCaseHTML;
        } else {
          phaseContent += testCaseHTML;
          content.innerHTML = phaseContent + '<div class="progress-bar"><div class="progress-fill" id="progress" style="width: ' + progressValue + '%"></div></div>';
        }
        
        document.getElementById('content').scrollIntoView({ behavior: 'smooth', block: 'end' });
        
        // 延迟一下让用户看到结果
        await new Promise(resolve => setTimeout(resolve, 300));
      }
      
      // 添加最终统计
      progressValue = 100;
      progress.style.width = progressValue + '%';
      
      const statsHTML = createStatsSection(profile);
      phaseContent += statsHTML;
      content.innerHTML = phaseContent;
      
      // 添加相似例句检索测试
      if (type === 'full') {
        const testSource = 'Click the settings button to configure your preferences.';
        const similarExamples = findSimilarExamples(testSource, profile.trainingExamples, 3);
        
        phaseContent += createPhaseSection(4, '相似例句检索', createSimilarExamplesSection(testSource, similarExamples));
        content.innerHTML = phaseContent;
      }
      
      // 恢复按钮
      runBtn.disabled = false;
      quickBtn.disabled = false;
      
      document.getElementById('content').scrollIntoView({ behavior: 'smooth', block: 'end' });
    }
    
    function createPhaseSection(phaseNum, title, content) {
      return `
        <div class="phase-section">
          <div class="phase-title">
            <span class="phase-number">${phaseNum + 1}</span>
            <span>${title}</span>
          </div>
          <div class="phase-section-content">${content}</div>
        </div>
      `;
    }
    
    function createTestCase(testCase, example, profile) {
      return `
        <div class="test-case">
          <div class="test-case-header">
            <span class="test-case-title">${testCase.description}</span>
            <span class="test-case-status status-success">✓ 成功</span>
          </div>
          <div class="test-case-content">
            <div class="field">
              <span class="field-label">原文:</span>
              <span class="field-value">${testCase.source}</span>
            </div>
            <div class="field">
              <span class="field-label">AI译文:</span>
              <span class="field-value">${testCase.aiTranslation}</span>
            </div>
            <div class="field">
              <span class="field-label">用户译文:</span>
              <span class="field-value">${testCase.userTranslation}</span>
            </div>
            <div class="field">
              <span class="field-label">差异:</span>
              <span class="field-value">${example.differences.join(', ')}</span>
            </div>
            ${profile.terminologyMappings && profile.terminologyMappings.length > 0 ? `
              <div class="field">
                <span class="field-label">术语映射:</span>
                <span class="field-value">${profile.terminologyMappings.slice(-1).map(m => `${m.sourceTerm}→${m.targetTerm}`).join(', ')}</span>
              </div>
            ` : ''}
            ${example.semanticDifferences && example.semanticDifferences.length > 0 ? `
              <div class="field">
                <span class="field-label">语义差异:</span>
                <span class="field-value">${example.semanticDifferences.map(d => `${d.type}(${d.category})`).join(', ')}</span>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }
    
    function createStatsSection(profile) {
      return `
        <div class="phase-section">
          <div class="phase-title">
            <span class="phase-number">📊</span>
            <span>最终统计</span>
          </div>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value">${profile.trainingDataSize}</div>
              <div class="stat-label">训练数据量</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${profile.learnedSegments}</div>
              <div class="stat-label">已学习句段</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${profile.habitualTranslations.length}</div>
              <div class="stat-label">习惯译法</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${profile.terminologyMappings?.length || 0}</div>
              <div class="stat-label">术语映射</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${profile.negativeExamples?.length || 0}</div>
              <div class="stat-label">负面示例</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${profile.successRate.toFixed(0)}%</div>
              <div class="stat-label">成功率</div>
            </div>
          </div>
        </div>
      `;
    }
    
    function createSimilarExamplesSection(source, examples) {
      return `
        <div class="test-case">
          <div class="test-case-header">
            <span class="test-case-title">测试原文: ${source}</span>
          </div>
          <div class="test-case-content">
            ${examples.map((ex, i) => `
              <div class="field" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #e9ecef;">
                <span class="field-label">例${i + 1}:</span>
                <span class="field-value">${ex.sourceText} → ${ex.userTranslation}</span>
              </div>
            `).join('')}
            ${examples.length === 0 ? '<div style="color: #6c757d;">暂无相似例句</div>' : ''}
          </div>
        </div>
      `;
    }
    
    function exportTestData() {
      if (!testProfile) {
        alert('请先运行测试！');
        return;
      }
      
      const dataStr = JSON.stringify(testProfile, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `twin-translator-test-${Date.now()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    
    function clearOutput() {
      document.getElementById('content').innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">🎯</div>
          <h2>准备就绪</h2>
          <p>点击"运行完整测试"开始验证孪生译员的所有功能</p>
        </div>
      `;
      testProfile = null;
    }
    
    // 暴露到全局
    window.runTest = runTest;
    window.exportTestData = exportTestData;
    window.clearOutput = clearOutput;
  </script>
</body>
</html>
